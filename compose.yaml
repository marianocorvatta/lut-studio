services:
  lut-studio:
    build: .
    image: lut-studio
    container_name: lut-studio
    ports:
      - "8173:80"
    environment:
      # carpeta del host donde se guardan los .cube exportados (vacía: se descargan con el navegador)
      LUT_EXPORT_DIR: ${LUT_EXPORT_DIR:-}
    volumes:
      - ${LUT_EXPORT_DIR:-./exports}:/luts
    restart: unless-stopped
