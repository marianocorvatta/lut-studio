server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # index.html sin caché, para tomar siempre la última versión
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # los assets llevan hash en el nombre
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
